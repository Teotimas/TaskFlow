<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <span class="navbar-brand fw-bold">TaskFlow</span>
        <div class="d-flex align-items-center gap-2">
          <span id="userBadge" class="badge text-bg-light d-none">studentas</span>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm d-none" type="button">Atsijungti</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section id="loginView" class="login-shell">
        <div class="login-panel">
          <h1 class="h3 mb-2">Prisijungimas</h1>
          <p class="text-secondary mb-4">Demo prisijungimas: studentas / slaptazodis</p>
          <form id="loginForm" class="vstack gap-3">
            <div>
              <label for="username" class="form-label">Vartotojo vardas</label>
              <input id="username" class="form-control" value="studentas" required>
            </div>
            <div>
              <label for="password" class="form-label">Slaptazodis</label>
              <input id="password" type="password" class="form-control" value="slaptazodis" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Prisijungti</button>
            <div id="loginMessage" class="small text-danger"></div>
          </form>
        </div>
      </section>

      <section id="appView" class="d-none">
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <form id="taskForm" class="panel vstack gap-3">
              <div>
                <h1 class="h4 mb-1">Uzduotis</h1>
                <p id="formMode" class="text-secondary mb-0">Sukurti nauja uzduoti</p>
              </div>
              <input id="taskId" type="hidden">
              <div>
                <label for="title" class="form-label">Pavadinimas</label>
                <input id="title" class="form-control" minlength="3" required>
              </div>
              <div>
                <label for="description" class="form-label">Aprasymas</label>
                <textarea id="description" class="form-control" rows="4" minlength="3" required></textarea>
              </div>
              <div class="row g-3">
                <div class="col-sm-6">
                  <label for="priority" class="form-label">Prioritetas</label>
                  <select id="priority" class="form-select" required>
                    <option value="low">Zemas</option>
                    <option value="medium" selected>Vidutinis</option>
                    <option value="high">Aukstas</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="deadline" class="form-label">Terminas</label>
                  <input id="deadline" type="date" class="form-control" required>
                </div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary flex-fill" type="submit">Issaugoti</button>
                <button id="cancelEditBtn" class="btn btn-outline-secondary d-none" type="button">Atmesti</button>
              </div>
              <div id="formMessage" class="small"></div>
            </form>
          </div>

          <div class="col-12 col-lg-8">
            <div class="panel">
              <div class="d-flex flex-column flex-md-row gap-3 justify-content-between mb-3">
                <div>
                  <h2 class="h4 mb-1">Uzduociu sarasas</h2>
                  <p class="text-secondary mb-0">Filtravimas naudoja query parametrus.</p>
                </div>
                <button id="refreshBtn" class="btn btn-outline-primary align-self-md-start" type="button">Atnaujinti</button>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-12 col-md-4">
                  <select id="statusFilter" class="form-select" aria-label="Statuso filtras">
                    <option value="">Visi statusai</option>
                    <option value="active">Aktyvios</option>
                    <option value="done">Atliktos</option>
                  </select>
                </div>
                <div class="col-12 col-md-4">
                  <select id="priorityFilter" class="form-select" aria-label="Prioriteto filtras">
                    <option value="">Visi prioritetai</option>
                    <option value="low">Zemas</option>
                    <option value="medium">Vidutinis</option>
                    <option value="high">Aukstas</option>
                  </select>
                </div>
                <div class="col-12 col-md-4">
                  <input id="searchFilter" class="form-control" placeholder="Paieska">
                </div>
              </div>

              <div id="tasksList" class="task-list"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
